name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 24, not the 22 the image runs on: the tests load the browser
      # scripts, and the gzip reader relies on DecompressionStream stopping
      # after one member as browsers do. Node 22 reads on.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No packages are needed: the tests load the browser scripts and the
      # frontend's TypeScript directly.
      - run: npm run test:unit

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # The tests replace MySQL and the network with fakes.
      - run: node --test "test/*.test.js"

  frontend:
    name: Frontend lint, types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint
      - run: npx tsc --noEmit
      # `npm run build` first writes the sample logs; --strict fails the job
      # when one of them could not be made.
      - run: node scripts/generate-samples.mjs --strict
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api
          BACKEND_API_URL: http://127.0.0.1:4000/api

  # The Playwright suite (tests/e2e) is not run here: it needs the whole stack
  # with MySQL and the GeoIP databases, which are downloaded with a MaxMind
  # licence key at runtime. Run it against a running instance:
  #   E2E_BASE_URL=http://127.0.0.1:3000 npx playwright test
